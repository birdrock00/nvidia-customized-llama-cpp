name: daily-release

# Builds the vendored NInfer tree into a CUDA 13.1 / sm_89 image and publishes it to GHCR.
# Runs once a day, on every push to the default branch, and on demand.

on:
  schedule:
    # 08:30 UTC daily. A daily build does not pull upstream; see FORK.md.
    - cron: '30 8 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push the resulting image to GHCR'
        type: boolean
        default: true
      no_cache:
        description: 'Ignore all cached layers (slow: full CUDA compile from scratch)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: daily-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The devel stage is a CUDA 13.1 toolchain: roughly 20 GiB extracted, on top of the
      # build tree and the runtime stage. Without this the runner can run out of disk
      # part-way through the export.
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                     /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true
          df -h /

      # nvcc peak RSS on this tree can exceed the runner's 16 GiB of RAM when several
      # translation units land at once; without swap the OOM killer takes the compiler down
      # with no useful error text. The runner image ships its own active /swapfile, which
      # cannot be truncated (ETXTBSY), so add a separate one and only when the total is low.
      - name: Ensure at least 16 GiB of swap
        run: |
          free -h
          have=$(swapon --show=SIZE --noheadings --bytes | awk '{s+=$1} END {print s+0}')
          echo "swap already available: ${have} bytes"
          if [ "$have" -lt 16000000000 ]; then
            sudo fallocate -l 16G /ninfer-swap \
              || sudo dd if=/dev/zero of=/ninfer-swap bs=1M count=16384 status=none
            sudo chmod 600 /ninfer-swap
            sudo mkswap /ninfer-swap
            sudo swapon /ninfer-swap || echo "::warning::could not enable /ninfer-swap; build may OOM"
          else
            echo "no extra swap needed"
          fi
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}},enable={{is_default_branch}}
            type=sha,format=short,prefix=git-
          labels: |
            org.opencontainers.image.title=nvidia-customized-llama-cpp
            org.opencontainers.image.description=NInfer 4090 (sm_89) image serving Qwen3.8-27B at 262K context
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # On non-dispatch events inputs.push_image is null, and GitHub casts null to false,
          # so `inputs.push_image != false` silently means "do not push". Be explicit: the
          # checkbox only applies to manual runs, everything else always pushes.
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          no-cache: ${{ inputs.no_cache == true }}
          # Registry cache, not the Actions cache: the CUDA devel layer blows straight
          # through the 10 GiB Actions quota. mode=max keeps the expensive compile stage.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Report
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
